<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisador da Linguagem de Desenho</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 30px auto;
            padding: 0 15px;
        }

        textarea {
            width: 100%;
            height: 160px;
            font-family: monospace;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            margin: 10px 0;
            padding: 8px 16px;
            font-size: 16px;
            cursor: pointer;
        }

        #saida {
            border: 1px solid #ccc;
            padding: 10px;
            min-height: 60px;
            white-space: pre-wrap;
            font-family: monospace;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
    <h1>Analisador da Linguagem de Desenho</h1>

    <textarea id="entrada" placeholder="Digite seu código aqui..."></textarea>

    <br>

    <button id="botao">Analisar código</button>

    <h3>Resultado</h3>

    <div id="saida"></div>

    <script type="module" src="main.js"></script>
</body>

</html>
